name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-secret-for-build-and-tests-only-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Arquivos proibidos e segredos
        run: node scripts/verifica-higiene.mjs
      - name: Dependencias vulneraveis (producao)
        run: npm audit --omit=dev
      - name: Diferenca sem erros de espaco
        run: git diff --check
